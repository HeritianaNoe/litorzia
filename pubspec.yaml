name: litorzia
description: "Alimanaka Katolika."
publish_to: 'none'
version: 1.0.3+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

  # Ho an'ny SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Ho an'ny fikojana ny sary avy amin'ny asset/URL amin'ny fomba mora
  cached_network_image: ^3.4.1

  # Ho an'ny fanamboarana daty malagasy raha ilaina
  intl: ^0.20.3

  # Ho an'ny fanaovana "partage" (fizarana) ny antsipiriany Olomasina sy ny Litorjika
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/ic_launcher.png"
  windows:
    generate: true
    image_path: "assets/images/ic_launcher.png"
    icon_size: 192

flutter_native_splash:
  # Lokon'ny lamosina (background) amin'ny splash screen
  color: "#FFFFFF"
  # Ilay icon fiangonana ampiasaina amin'ny launcher no hipoitra eo afovoan'ny splash
  image: assets/images/ic_launcher.png
  # Soratra "Litorjika Katolika" eo ambanin'ilay icon
  branding: assets/images/splash_branding.png
  branding_mode: bottom

  android_12:
    color: "#FFFFFF"
    image: assets/images/ic_launcher.png
    icon_background_color: "#FFFFFF"
    branding: assets/images/splash_branding.png

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/json/litorjika.json
    - assets/json/olomasina.json
    - assets/json/vavaka.json

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
          style: italic