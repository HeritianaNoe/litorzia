name: Flutter Android Production Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # Dingana fanampiny: Avadika ho rakitra .jks indray ilay base64 avy ao amin'ny GitHub Secrets
    - name: Decode Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
    - name: Install dependencies
      run: flutter pub get

    # Manao build miaraka amin'ny variables avy ao amin'ny GitHub Secrets ho an'ny sonia
    - name: Build Signed APK
      run: |
        flutter build apk --release \
          --dart-define=KEYSTORE_FILE=upload-keystore.jks \
          --dart-define=KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
          --dart-define=KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
          --dart-define=KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-signed-apk
        path: build/app/outputs/flutter-apk/app-release.apk
