name: Flutter Android Production Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. Avadika ho rakitra .jks ny Keystore avy amin'ny Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      # 2. Amboarina ny key.properties ao amin'ny lahatahiry android/ (hovakin'ny build.gradle.kts)
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 3. Maka ireo packages/dependencies ilaina
      - name: Install dependencies
        run: flutter pub get

      # 4. Manao Build ny Production Signed APK
      - name: Build Signed APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 5. Ampidirina ao amin'ny GitHub Artifacts ny APK rehefa vita ny build
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
